[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "Downloads, validates and transforms open country indicators for Atlas"
readme = "README.md"
authors = [
    { name = "OscarFdz24", email = "chinchillalopezfernandez@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pandera[polars]>=0.33.1",
    "polars>=1.44.2",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
atlas = "atlas_pipeline.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]

[tool.mypy]
python_version = "3.13"
packages = ["atlas_pipeline"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
